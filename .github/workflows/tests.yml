name: Tests

on:
  push:
    branches: [main, "handover/**"]
  pull_request:
    branches: [main, "handover/**"]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -c constraints-windows-py314.txt
      - run: python -m compileall backend ml data_pipeline integration
      - run: pytest backend/tests integration
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
